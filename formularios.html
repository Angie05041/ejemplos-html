<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clínica Dental</title>
</head>
<body>

<div style="text-align: center;"> <!--la propiedad text-align centra elementos línea-->
  <img height="192px" src="img/dental_clinic.svg" alt="Logo Dental Clinic">
</div>
<p>WebApp para Clínica Dental</p>
<p>Desarrollado por ADSI</p>
<h2 style="color: #2b6cb0;">Información del Paciente</h2> <!--la propiedad color, colorea el texto-->
<hr>

<form action="" method="post"> <!--Creamos el formulario-->

  <div>
    <label for="nombre">Nombre del Paciente</label>
    <!--Solo letras y espacios: lo demás se borra al escribir-->
    <input type="text" id="nombre" name="nombre" placeholder="Escriba su Nombre"
           required maxlength="50"
           pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ ]+"
           title="Solo se permiten letras y espacios"
           oninput="this.value = this.value.replace(/[^A-Za-zÁÉÍÓÚáéíóúÑñ ]/g, '')">
  </div>

  <div>
    <label for="tipo_doc">Tipo de documento</label>
    <select id="tipo_doc" name="tipo_doc" required>
      <option value="">-Seleccione-</option>
      <option value="CC">Cédula de Ciudadanía</option>
      <option value="TI">Tarjeta de Identidad</option>
      <option value="RC">Registro Civil</option>
      <option value="CE">Cédula de Extranjería</option>
      <option value="PA">Pasaporte</option>
    </select>
  </div>

  <div>
    <label for="documento">N° de Documento</label>
    <!--type text para quitar las flechas; solo números de 6 a 10 dígitos-->
    <input type="text" id="documento" name="documento" placeholder="Números sin puntos"
           required inputmode="numeric" maxlength="10"
           pattern="[0-9]{6,10}"
           title="Solo números, entre 6 y 10 dígitos"
           oninput="this.value = this.value.replace(/[^0-9]/g, '')">
  </div>

  <div>
    <label for="fecha_nac">Fecha de Nacimiento</label>
    <!--max impide elegir fechas futuras-->
    <input type="date" id="fecha_nac" name="fecha_nac" required max="2026-10-07">
  </div>

  <div>
    <label>Sexo</label>
    <!--el mismo name hace que solo se pueda elegir una opción-->
    <input type="radio" id="m" name="sexo" value="M" required><label for="m">Masculino</label>
    <input type="radio" id="f" name="sexo" value="F"><label for="f">Femenino</label>
  </div>

  <div>
    <label for="correo">Correo del Paciente</label>
    <input type="email" id="correo" name="correo" placeholder="ejemplo@empresa.com"
           required title="Escriba un correo válido, por ejemplo: nombre@correo.com">
  </div>

  <div>
    <label for="celular">N° de Celular</label>
    <!--Solo números, exactamente 10 dígitos-->
    <input type="tel" id="celular" name="celular" placeholder="Ej: 3001234567"
           required inputmode="numeric" maxlength="10"
           pattern="[0-9]{10}"
           title="El celular debe tener 10 números"
           oninput="this.value = this.value.replace(/[^0-9]/g, '')">
  </div>

  <div>
    <label for="observacion">Observación Médica del Paciente</label>
    <br>
    <textarea id="observacion" name="observacion" rows="3" maxlength="300"
              placeholder="Escriba aquí su comentario..."></textarea>
  </div>
